name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  macos-app:
    # The only place the SwiftUI menu bar app can be compiled.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swiftc --version
      - run: macos/build.sh
      - run: test -x macos/Quotacheck.app/Contents/MacOS/Quotacheck
